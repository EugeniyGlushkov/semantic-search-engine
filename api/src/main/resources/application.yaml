spring:
  application:
    name: semantic-search-api

  profiles:
    active: local

  kafka:
    bootstrap-servers: ${kafka-bootstrap-servers:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

grpc:
  client:
    semantic-search-service:
      address: ${grpc-client-semantic-search-address}
      negotiation-type: plaintext

urls:
  worker: http://localhost:8081

---
spring:
  config:
    activate:
      on-profile: local

grpc-client-semantic-search-address: static://localhost:9090

management:
  endpoints:
    web:
      exposure:
        include: info,health
  info:
    env:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: docker

grpc-client-semantic-search-address: static://semantic-search-worker-service:9090

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # Добавляем prometheus для сбора метрик
  metrics:
    export:
      prometheus:
        enabled: true                    # Включаем экспорт в формат Prometheus
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  endpoint:
    prometheus:
      enabled: true

urls:
  worker: http://semantic-search-worker-service:8080

kafka-bootstrap-servers: kafka-service:9092