apiVersion: v1
kind: Pod
metadata:
  name: model-uploader
spec:
  containers:
    - name: uploader
      image: alpine:latest
      command: ["sh", "-c", "sleep 86400"]   # спит 24 часа
      volumeMounts:
        - name: models-storage
          mountPath: /mnt/models
  volumes:
    - name: models-storage
      persistentVolumeClaim:
        claimName: models-pvc
  restartPolicy: Never