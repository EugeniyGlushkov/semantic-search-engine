# ===============================================
# 1. ServiceAccount — учётная запись для Prometheus
# ===============================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus              # Имя учётной записи
  namespace: default            # В каком namespace она создаётся
# Эта учётная запись будет использоваться подом Prometheus для аутентификации в Kubernetes API.
---
# ===============================================
# 2. ClusterRole — набор разрешений (правил)
# ===============================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus              # Имя роли
rules:
  - apiGroups: [""]             # "" — это core API группа (поды, сервисы, endpoints)
    resources:                  # Какие ресурсы можно читать
      - "pods"                  # Поды (чтобы находить поды с метриками)
      - "services"              # Сервисы (чтобы находить сервисы)
      - "endpoints"             # Эндпоинты (чтобы находить эндпоинты)
    verbs:                      # Какие действия разрешены
      - "get"                   # Получить конкретный объект
      - "list"                  # Получить список объектов
      - "watch"                 # Следить за изменениями
# Эта роль даёт права на чтение информации о подах, сервисах и эндпоинтах.
---
# ===============================================
# 3. ClusterRoleBinding — связывает ServiceAccount с ClusterRole
# ===============================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus              # Имя связки
subjects:                       # Кого связываем
  - kind: ServiceAccount
    name: prometheus            # Имя ServiceAccount (из пункта 1)
    namespace: default          # Namespace, где находится ServiceAccount
roleRef:                        # С чем связываем
  kind: ClusterRole
  name: prometheus              # Имя ClusterRole (из пункта 2)
  apiGroup: rbac.authorization.k8s.io
# Это связывает учётную запись prometheus с ролью prometheus.
# Теперь под, использующий этот ServiceAccount, может читать поды, сервисы и эндпоинты.