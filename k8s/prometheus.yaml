# ===============================================
# 1. ConfigMap — конфигурация Prometheus
# ===============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config               # Имя ConfigMap, которое будет смонтировано в под
data:
  prometheus.yml: |                     # Сам конфигурационный файл Prometheus
    # Глобальные настройки, применяемые ко всем джобам
    global:
      scrape_interval: 15s              # Как часто собирать метрики (по умолчанию)

    # Список джобов (заданий) — каждый джоб собирает метрики с определённой группы подов
    scrape_configs:

      # =============================================
      # Джоб 1: Сбор метрик с API-сервиса
      # =============================================
      - job_name: 'semantic-search-api' # Имя джоба. Будет отображаться в Prometheus и Grafana

        # Используем Kubernetes Service Discovery для автоматического поиска подов
        kubernetes_sd_configs:
          - role: pod                   # Искать поды (можно также node, service, endpoint)

        # Правила перезаписи меток (relabel_configs) — позволяют фильтровать и изменять адреса целей
        relabel_configs:
          # 1. Оставляем только поды с лейблом app=semantic-search-api
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep                # keep — оставляем только те цели, которые подходят под regex
            regex: semantic-search-api

          # 2. Оставляем только поды, у которых есть аннотация prometheus.io/scrape=true
          # Это позволяет выборочно включать сбор метрик для подов
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true

          # 3. Заменяем стандартный путь сбора метрик на путь из аннотации prometheus.io/path
          # Если аннотация есть, то берём её значение, иначе путь остаётся /metrics
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)                  # Если аннотация не пустая, подставляем её значение

          # 4. Формируем адрес: IP_пода:порт из аннотации prometheus.io/port
          # Если аннотация с портом есть, используем её, иначе порт по умолчанию
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)   # Разбиваем адрес и порт
            replacement: $1:$2              # Собираем в формате IP:ПОРТ
            target_label: __address__

      # =============================================
      # Джоб 2: Сбор метрик с Worker-сервиса
      # =============================================
      - job_name: 'semantic-search-worker' # Имя джоба для Worker

        kubernetes_sd_configs:
          - role: pod

        relabel_configs:
          # 1. Оставляем только поды с лейблом app=semantic-search-worker
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: semantic-search-worker

          # 2. Проверяем аннотацию prometheus.io/scrape
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true

          # 3. Путь к метрикам из аннотации
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)

          # 4. Формируем адрес: IP_пода:порт из аннотации prometheus.io/port
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

# ===============================================
# 2. Deployment — сам Prometheus
# ===============================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1                            # Одна реплика (для демонстрации)
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus     # Используем ServiceAccount с правами на чтение подов
      containers:
        - name: prometheus
          image: prom/prometheus:latest  # Официальный образ Prometheus
          ports:
            - containerPort: 9090        # Порт, на котором Prometheus слушает внутри контейнера
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus # Монтируем конфиг в папку /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config      # Используем ConfigMap, созданный выше

# ===============================================
# 3. Service — доступ к Prometheus внутри и снаружи кластера
# ===============================================
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
spec:
  selector:
    app: prometheus                     # Сервис направляет трафик на поды с этим лейблом
  ports:
    - protocol: TCP
      port: 9090                        # Порт, на котором сервис доступен внутри кластера
      targetPort: 9090                  # Порт в контейнере
      nodePort: 30909                   # Внешний порт (диапазон 30000-32767)
  type: NodePort                        # Делает сервис доступным извне кластера