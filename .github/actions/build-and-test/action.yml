name: 'Build and Test'
description: 'Setup JDK 21, build and test the project'

runs:
  using: 'composite'
  steps:
    - name: Setup JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew

    - name: Build and test
      shell: bash
      run: ./gradlew clean build